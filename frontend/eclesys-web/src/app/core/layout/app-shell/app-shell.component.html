<div class="shell">
  <!-- TOPBAR -->
  <mat-toolbar class="topbar">
    <div class="topbar__left">
      <!-- BRAND -->
      <div class="topbar__brand">
        @if (tenantLogoUrl(); as logoUrl) {
          <img
            class="topbar__brand-logo topbar__brand-logo--tenant"
            [src]="logoUrl"
            alt="Logo da igreja"
          />
          <span class="topbar__brand-separator">|</span>
          <img
            class="topbar__brand-logo"
            src="assets/brand/eclesys-logo-white.svg"
            alt="ECLESYS"
          />
        } @else {
          <img
            class="topbar__brand-logo"
            src="assets/brand/eclesys-logo-white.svg"
            alt="ECLESYS"
          />

          <div class="topbar__brand-text">
            <div class="topbar__brand-subtitle">administração</div>
          </div>
        }
      </div>

      <!-- NAV -->
      <nav class="topbar__nav">
        <button
          mat-button
          class="topbar__nav-btn"
          [matMenuTriggerFor]="menuDashboard"
        >
          Dashboard
          <mat-icon>expand_more</mat-icon>
        </button>
        <mat-menu #menuDashboard="matMenu">
          <button mat-menu-item routerLink="/app/dashboard">Dashboard</button>
        </mat-menu>

        <button
          mat-button
          class="topbar__nav-btn"
          [matMenuTriggerFor]="menuAdmin"
        >
          Administração
          <mat-icon>expand_more</mat-icon>
        </button>

        <mat-menu #menuAdmin="matMenu">
          <button mat-menu-item routerLink="/app/organizations">
            <mat-icon>church</mat-icon>
            Organizações
          </button>
          <button mat-menu-item routerLink="/app/members">
            <mat-icon>people</mat-icon>
            Membros
          </button>
          <button mat-menu-item routerLink="/app/pending-approvals">
            <mat-icon>how_to_reg</mat-icon>
            Aprovações
          </button>
          <button mat-menu-item routerLink="/app/church-roles">
            <mat-icon>badge</mat-icon>
            Cargos Eclesiásticos
          </button>
          <button mat-menu-item routerLink="/app/function-roles">
            <mat-icon>assignment_ind</mat-icon>
            Funções Administrativas
          </button>
          <button mat-menu-item routerLink="/app/users">
            <mat-icon>group</mat-icon>
            Usuários
          </button>
        </mat-menu>

        <button
          mat-button
          class="topbar__nav-btn"
          [matMenuTriggerFor]="menuEvents"
        >
          Eventos
          <mat-icon>expand_more</mat-icon>
        </button>
        <mat-menu #menuEvents="matMenu">
          <button mat-menu-item routerLink="/app/santa-ceia">
            <mat-icon>event_available</mat-icon>
            Santa Ceia
          </button>
        </mat-menu>
      </nav>
    </div>

    <span class="topbar__spacer"></span>

    <!-- USER -->
    <div class="topbar__right">
      <button
        mat-button
        class="topbar__user-btn"
        [matMenuTriggerFor]="userMenu"
      >
        <app-user-avatar
          class="topbar__user-avatar"
          [userNameSignal]="meNameSignal()"
          [userEmailSignal]="meEmailSignal()"
          [sizeSignal]="32"
          ariaLabelSignal="Avatar do usuário"
        ></app-user-avatar>

        <div class="topbar__user-text">
          @if (authStore.me(); as me) {
            <div class="topbar__user-name">
              {{ me.name }}
            </div>
            <div class="topbar__user-tenant">
              {{ me.tenantName }}
            </div>
          } @else {
            <div class="topbar__user-name">Carregando…</div>
            <div class="topbar__user-tenant">—</div>
          }
        </div>

        <mat-icon>expand_more</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <button mat-menu-item [routerLink]="'/app/profile'">
          <mat-icon>person</mat-icon>
          Meu Perfil
        </button>
        <button mat-menu-item disabled>
          <mat-icon>settings</mat-icon>
          Configurações
        </button>
        <button mat-menu-item (click)="authStore.logout()">
          <mat-icon>logout</mat-icon>
          Sair
        </button>
      </mat-menu>
    </div>
  </mat-toolbar>

  <!-- CONTENT -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer__inner">
      <span>© {{ currentYear }} ECLESYS</span>
      <span class="dot">•</span>
      <span>Administração</span>
    </div>
  </footer>
</div>
