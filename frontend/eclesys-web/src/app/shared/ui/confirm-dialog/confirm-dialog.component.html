<div class="dialog-content">
  <p class="dialog-message">{{ data.message }}</p>
  <div class="dialog-actions">
    <p-button
      [label]="data.cancelLabel || 'Cancelar'"
      [outlined]="true"
      severity="secondary"
      (onClick)="cancel()"
    />
    <p-button
      [label]="data.confirmLabel || 'Confirmar'"
      (onClick)="confirm()"
    />
  </div>
</div>
