<div class="flex flex-col gap-4 p-2">
  <p-iconfield>
    <p-inputicon styleClass="pi pi-search" />
    <input
      pInputText
      [ngModel]="searchTerm()"
      (ngModelChange)="searchTerm.set($event)"
      placeholder="Digite o nome da congregação ou setor"
      class="w-full"
    />
  </p-iconfield>

  <div class="list flex flex-col gap-2 max-h-72 overflow-y-auto">
    @if (filteredCongregations().length === 0) {
      <div class="text-gray-500 text-sm py-4 text-center">Nenhuma congregação encontrada.</div>
    } @else {
      @for (org of filteredCongregations(); track org.id) {
        <div class="flex items-start gap-2 py-1">
          <p-checkbox
            [binary]="true"
            [ngModel]="isSelected(org.id)"
            (ngModelChange)="toggleSelection(org.id, $event)"
            [inputId]="'org-' + org.id"
          />
          <label [for]="'org-' + org.id" class="cursor-pointer">
            <div class="font-medium text-sm">{{ org.name }}</div>
            @if (org.parentName) {
              <div class="text-gray-500 text-xs">{{ org.parentName }}</div>
            }
          </label>
        </div>
      }
    }
  </div>

  <div class="flex justify-end gap-2 pt-2 border-t">
    <p-button label="Limpar" severity="secondary" [outlined]="true" (onClick)="clear()" />
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="cancel()" />
    <p-button [label]="'Aplicar (' + selectedIds().length + ')'" (onClick)="apply()" />
  </div>
</div>
