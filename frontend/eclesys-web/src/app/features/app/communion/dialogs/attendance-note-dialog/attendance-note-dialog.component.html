<p-dialog
  [header]="'Justificativa — ' + memberName"
  [(visible)]="visible"
  (visibleChange)="visibleChange.emit($event)"
  appendTo="body"
  [modal]="true"
  [style]="dialogStyle"
  [closable]="true"
  (onHide)="closed.emit()"
>
  <div class="field">
    <label for="note">Justificativa</label>
    <textarea
      pTextarea
      id="note"
      [formControl]="noteControl"
      rows="5"
      maxlength="500"
      [readonly]="!canEdit"
      placeholder="Descreva o motivo (opcional)"
      class="w-full"
    ></textarea>
    <small class="hint-text">Até 500 caracteres</small>
  </div>

  <ng-template pTemplate="footer">
    <p-button
      [label]="canEdit ? 'Cancelar' : 'Fechar'"
      [outlined]="true"
      severity="secondary"
      (onClick)="close()"
    />
    @if (canEdit) {
      <p-button label="Salvar" [disabled]="!canSave()" (onClick)="save()" />
    }
  </ng-template>
</p-dialog>
