<h2 mat-dialog-title>Justificativa de ausência</h2>

<mat-dialog-content class="dialog-content">
  <div class="member-name">{{ data.memberName }}</div>

  <mat-form-field appearance="outline">
    <mat-label>Justificativa</mat-label>
    <textarea
      matInput
      rows="5"
      maxlength="500"
      [formControl]="noteControl"
      [readonly]="!data.canEdit"
      placeholder="Descreva o motivo (opcional)"
    ></textarea>
    <mat-hint>Até 500 caracteres</mat-hint>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="close()">
    {{ data.canEdit ? 'Cancelar' : 'Fechar' }}
  </button>
  @if (data.canEdit) {
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="save()"
      [disabled]="!canSave()"
    >
      Salvar
    </button>
  }
</mat-dialog-actions>
