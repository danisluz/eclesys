<div class="dialog-content">
  <p class="member-name">{{ data.memberName }}</p>

  <div class="field">
    <label for="note">Justificativa</label>
    <textarea
      pTextarea
      id="note"
      [formControl]="noteControl"
      rows="5"
      maxlength="500"
      [readonly]="!data.canEdit"
      placeholder="Descreva o motivo (opcional)"
    ></textarea>
    <small class="hint-text">Até 500 caracteres</small>
  </div>

  <div class="dialog-actions">
    <p-button
      [label]="data.canEdit ? 'Cancelar' : 'Fechar'"
      [outlined]="true"
      severity="secondary"
      (onClick)="close()"
    />
    @if (data.canEdit) {
      <p-button label="Salvar" [disabled]="!canSave()" (onClick)="save()" />
    }
  </div>
</div>
