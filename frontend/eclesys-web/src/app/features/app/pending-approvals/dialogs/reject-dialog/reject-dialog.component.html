<div class="dialog-content">
  <p class="dialog-description">
    Você está rejeitando a transferência de
    <strong>{{ data.transfer.memberName }}</strong>.
  </p>

  <div class="field">
    <label for="reason">Motivo da rejeição</label>
    <textarea
      pTextarea
      id="reason"
      [(ngModel)]="reason"
      rows="4"
      placeholder="Explique o motivo da rejeição..."
    ></textarea>
    <small class="hint-text">Este motivo será visível para o solicitante</small>
  </div>

  <div class="dialog-actions">
    <p-button label="Cancelar" [outlined]="true" severity="secondary" (onClick)="cancel()" />
    <p-button
      label="Rejeitar"
      severity="danger"
      [disabled]="!reason || reason.trim().length === 0"
      (onClick)="confirm()"
    />
  </div>
</div>
