<div class="page">

  <header class="page__header">
    <div>
      <h1 class="page__title">Funções Administrativas</h1>
      <p class="page__subtitle">Gerencie as funções operacionais (Líder, Secretário, Tesoureiro, etc.)</p>
    </div>
    <p-button label="Nova Função" icon="pi pi-plus" (onClick)="openCreateDrawer()" />
  </header>

  <div class="table-card">
    <p-table
      [value]="roles()"
      [loading]="loading()"
      class="p-datatable-sm"
    >
      <ng-template pTemplate="header">
        <tr>
          <th scope="col">Nome</th>
          <th scope="col">Escopo</th>
          <th scope="col" style="width: 120px">Limite</th>
          <th scope="col" style="width: 100px">Ordem</th>
          <th scope="col" style="width: 100px">Ativo</th>
          <th scope="col" style="width: 100px">Ações</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-role>
        <tr>
          <td><span class="role-name">{{ role.name }}</span></td>
          <td><p-tag [value]="getScopeLabel(role.scopeType)" severity="secondary" /></td>
          <td><span class="text-muted">{{ role.maxHolders ?? 'Ilimitado' }}</span></td>
          <td><span class="text-muted">{{ role.sortOrder }}</span></td>
          <td>
            <p-toggleswitch
              [(ngModel)]="role.isActive"
              (onChange)="toggleActive(role, $event.checked)"
            />
          </td>
          <td>
            <p-button
              icon="pi pi-pencil"
              [text]="true"
              [rounded]="true"
              size="small"
              pTooltip="Editar"
              tooltipPosition="top"
              (onClick)="openEditDrawer(role)"
            />
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6">
            <div class="empty-state">
              <i class="pi pi-briefcase empty-state__icon"></i>
              <p class="empty-state__text">Nenhuma função cadastrada</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>

<p-drawer
  [(visible)]="drawerVisible"
  position="right"
  [style]="{ width: '480px' }"
  [header]="drawerMode() === 'create' ? 'Nova Função' : 'Editar Função'"
>
  <app-function-role-form-dialog
    [mode]="drawerMode()"
    [role]="selectedRole()"
    [maxSortOrder]="maxSortOrder"
    (saved)="onSaved()"
    (cancelled)="onCancelled()"
  />
</p-drawer>
