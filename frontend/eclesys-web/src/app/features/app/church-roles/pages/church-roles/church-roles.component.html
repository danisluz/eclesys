<div class="page">

  <header class="page__header">
    <div>
      <h1 class="page__title">Cargos Eclesiásticos</h1>
      <p class="page__subtitle">Gerencie os cargos da sua organização</p>
    </div>
    <p-button label="Novo Cargo" icon="pi pi-plus" (onClick)="openCreateDialog()" />
  </header>

  <div class="table-card">
    <p-table
      [value]="roles()"
      [loading]="loading()"
      class="p-datatable-sm"
    >
      <ng-template pTemplate="header">
        <tr>
          <th scope="col">Nome</th>
          <th scope="col" style="width: 120px">Ordem</th>
          <th scope="col" style="width: 100px">Ativo</th>
          <th scope="col" style="width: 100px">Ações</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-role>
        <tr>
          <td><span class="role-name">{{ role.name }}</span></td>
          <td><span class="text-muted">{{ role.sortOrder }}</span></td>
          <td>
            <p-toggleswitch
              [(ngModel)]="role.isActive"
              (onChange)="toggleActive(role, $event.checked)"
            />
          </td>
          <td>
            <p-button
              icon="pi pi-pencil"
              [text]="true"
              [rounded]="true"
              size="small"
              pTooltip="Editar"
              tooltipPosition="top"
              (onClick)="openEditDialog(role)"
            />
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4">
            <div class="empty-state">
              <i class="pi pi-id-card empty-state__icon"></i>
              <p class="empty-state__text">Nenhum cargo cadastrado</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>
