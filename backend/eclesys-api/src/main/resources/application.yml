spring:
  application:
    name: eclesys-api

  datasource:
    url: jdbc:postgresql://localhost:5432/eclesys
    username: eclesys
    password: eclesys
    driver-class-name: org.postgresql.Driver

  jpa:
    ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

eclesys:
  jwt:
    secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_64_CHARS_1234567890_CHANGE_ME"
    expiration-minutes: 480  # 8 horas para desenvolvimento
  storage:
    tenant-logos-path: "./storage/tenant-logos"

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.security.web.FilterChainProxy: TRACE

security:
  turnstile:
    secret: ${TURNSTILE_SECRET:}
    dev-mode: ${TURNSTILE_DEV_MODE:true}
